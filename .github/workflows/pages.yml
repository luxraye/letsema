name: Pages redirect

# The old GitHub Pages address forwards to the live portal on Firebase App Hosting.
on:
  push:
    branches: [main]
    paths: ['.github/pages/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .github/pages
      - id: deployment
        uses: actions/deploy-pages@v4
